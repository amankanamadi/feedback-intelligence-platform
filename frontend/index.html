<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feedback Intelligence Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">AI Customer Feedback Intelligence Platform</span>
      <button id="refresh-btn" class="btn btn-outline-light btn-sm">Refresh</button>
    </div>
  </nav>

  <div class="container-fluid pb-5">
    <div class="row g-3 mb-4" id="kpi-cards"></div>

    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="card p-3 h-100">
          <h6>Sentiment</h6>
          <canvas id="sentimentChart"></canvas>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card p-3 h-100">
          <h6>Category Breakdown</h6>
          <canvas id="categoryChart"></canvas>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card p-3 h-100">
          <h6>Confidence Distribution</h6>
          <canvas id="confidenceChart"></canvas>
        </div>
      </div>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <div class="card p-3 h-100">
          <h6>Weekly Trend</h6>
          <canvas id="trendChart"></canvas>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card p-3 h-100">
          <h6>Top Themes</h6>
          <canvas id="themeChart"></canvas>
        </div>
      </div>
    </div>

    <div class="card p-3 mb-4">
      <h6>Submit Feedback</h6>
      <form id="feedback-form">
        <div class="row g-2 mb-2">
          <div class="col-12">
            <input type="text" id="feedback-text" class="form-control" placeholder="Enter customer feedback..." required>
          </div>
        </div>
        <div class="row g-2 mb-2">
          <div class="col-md-3">
            <select id="feedback-source" class="form-select">
              <option value="Web Form">Web Form</option>
              <option value="In-App Widget">In-App Widget</option>
              <option value="Mobile App">Mobile App</option>
              <option value="Email">Email</option>
              <option value="API">API</option>
              <option value="Survey">Survey</option>
              <option value="Chatbot">Chatbot</option>
              <option value="QR Code">QR Code</option>
            </select>
          </div>
          <div class="col-md-3">
            <input type="text" id="feedback-product" class="form-control" placeholder="Product">
          </div>
          <div class="col-md-3">
            <input type="text" id="feedback-module" class="form-control" placeholder="Module">
          </div>
          <div class="col-md-3">
            <input type="text" id="feedback-version" class="form-control" placeholder="Version">
          </div>
        </div>
        <div class="row g-2 mb-2">
          <div class="col-md-3">
            <input type="text" id="feedback-user-id" class="form-control" placeholder="User ID">
          </div>
          <div class="col-md-3">
            <input type="text" id="feedback-name" class="form-control" placeholder="Name">
          </div>
          <div class="col-md-3">
            <input type="email" id="feedback-email" class="form-control" placeholder="Email">
          </div>
          <div class="col-md-3">
            <input type="text" id="feedback-region" class="form-control" placeholder="Region">
          </div>
        </div>
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-primary" type="submit">Submit</button>
          <span id="detected-context" class="text-muted small"></span>
        </div>
      </form>
      <div id="feedback-form-status" class="form-text"></div>
    </div>

    <div class="card p-3 mb-3">
      <div class="row g-2">
        <div class="col-md-3">
          <select id="filter-category" class="form-select">
            <option value="">All Categories</option>
            <option value="Incident">Incident</option>
            <option value="Service Request">Service Request</option>
            <option value="General Feedback">General Feedback</option>
          </select>
        </div>
        <div class="col-md-3">
          <select id="filter-sentiment" class="form-select">
            <option value="">All Sentiments</option>
            <option value="Positive">Positive</option>
            <option value="Neutral">Neutral</option>
            <option value="Negative">Negative</option>
          </select>
        </div>
        <div class="col-md-3">
          <select id="filter-source" class="form-select">
            <option value="">All Sources</option>
            <option value="Web Form">Web Form</option>
            <option value="In-App Widget">In-App Widget</option>
            <option value="Mobile App">Mobile App</option>
            <option value="Email">Email</option>
            <option value="API">API</option>
            <option value="Survey">Survey</option>
            <option value="Chatbot">Chatbot</option>
            <option value="QR Code">QR Code</option>
          </select>
        </div>
        <div class="col-md-3">
          <input type="text" id="filter-product" class="form-control" placeholder="Filter by product...">
        </div>
        <div class="col-md-6">
          <input type="text" id="search-input" class="form-control" placeholder="Search feedback text...">
        </div>
      </div>
    </div>

    <div class="card p-3">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th>ID</th>
              <th>Feedback</th>
              <th>Category</th>
              <th>Sentiment</th>
              <th>Priority</th>
              <th>Confidence</th>
              <th>Created</th>
            </tr>
          </thead>
          <tbody id="feedback-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="feedback-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Feedback Detail</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="feedback-modal-body"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="/static/dashboard.js"></script>
</body>
</html>
