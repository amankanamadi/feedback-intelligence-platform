services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-feedback_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feedback_app_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-feedback_intelligence}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-feedback_app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-feedback_app}:${POSTGRES_PASSWORD:-feedback_app_dev_pw}@db:5432/${POSTGRES_DB:-feedback_intelligence}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    env_file: .env
    environment:
      DEBUG: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-feedback_app}:${POSTGRES_PASSWORD:-feedback_app_dev_pw}@db:5432/${POSTGRES_DB:-feedback_intelligence}
      CHROMA_PERSIST_DIR: /app/data/chroma
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS:-2}"
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/data/chroma
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  chroma_data:
