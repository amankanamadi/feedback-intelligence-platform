services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-feedback_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feedback_app_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-feedback_intelligence}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-feedback_app} -d ${POSTGRES_DB:-feedback_intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-feedback_app}:${POSTGRES_PASSWORD:-feedback_app_dev_pw}@db:5432/${POSTGRES_DB:-feedback_intelligence}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    env_file: .env
    environment:
      DEBUG: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-feedback_app}:${POSTGRES_PASSWORD:-feedback_app_dev_pw}@db:5432/${POSTGRES_DB:-feedback_intelligence}
      ATTACHMENTS_DIR: /app/attachments
    volumes:
      - attachments_data:/app/attachments
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS:-2}"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      args:
        # Baked into the browser bundle at build time - must be an
        # externally-reachable URL, never an internal service hostname.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    environment:
      # Read at runtime by web/proxy.ts only (server-side, inside this
      # container) - the internal compose network hostname for `app`.
      INTERNAL_API_BASE_URL: http://app:8000
    ports:
      - "3000:3000"
    depends_on:
      - app

volumes:
  postgres_data:
  attachments_data:
